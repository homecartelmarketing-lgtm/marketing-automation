name: Continuous Integration & Tests

on:
  push:
    branches: [marketing-automation, main]
  pull_request:
    branches: [marketing-automation, main]
  workflow_dispatch:

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Env Schema Check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0 libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "git+https://github.com/ultralytics/CLIP.git"
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run full unit test suite
        env:
          AIRTABLE_TOKEN: "mock_airtable_token"
          AIRTABLE_BASE_ID: "appMockBase123"
          FAL_KEY: "mock_fal_key"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Verify .env.example covers every env key used in code
        run: |
          python - <<'EOF'
          import re, sys
          from pathlib import Path

          root = Path(".")
          skip = {"archive", "scratch", "output", "node_modules", ".git", "dist"}
          pat = re.compile(
              r"""os\.(?:getenv|environ\.get)\(\s*["']([A-Z][A-Z0-9_]+)["']"""
              r"""|os\.environ\[\s*["']([A-Z][A-Z0-9_]+)["']\s*\]"""
          )
          used = {}

          for py in root.rglob("*.py"):
              if any(part in skip for part in py.parts):
                  continue
              for match in pat.finditer(
                  py.read_text(encoding="utf-8", errors="ignore")
              ):
                  used.setdefault(
                      match.group(1) or match.group(2),
                      py.as_posix()
                  )

          example = set(
              re.findall(
                  r"^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=",
                  Path(".env.example").read_text(encoding="utf-8"),
                  re.M,
              )
          )

          ignore = {
              "PORT",
              "PYTHONUNBUFFERED",
              "PYTHONDONTWRITEBYTECODE",
          }
          missing = sorted(
              key for key in used
              if key not in example and key not in ignore
          )

          if missing:
              print(
                  f"::error::{len(missing)} env keys used in code "
                  "but missing from .env.example:"
              )
              for key in missing:
                  print(f"  - {key}  (first seen in {used[key]})")
              sys.exit(1)

          print(
              f"OK: all {len(used)} env keys used in code "
              "are documented in .env.example"
          )
          EOF
